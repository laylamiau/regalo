<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Te amo ♡</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;font-family:Georgia,"Times New Roman",serif;background:#f8c8dc;color:#8f536a}.page{position:relative;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 18%,#ffffffb5,transparent 27%),radial-gradient(circle at 82% 82%,#ffffff7d,transparent 30%)}.card{position:relative;z-index:2;width:min(91vw,650px);padding:52px 38px 45px;text-align:center;background:#fffaf3;border-radius:28px;box-shadow:0 25px 70px #64283c38;animation:appear 1s ease both}.tiny{font-size:15px;font-style:italic;color:#b2768e;margin-bottom:12px}.title{margin:0 0 25px;font-size:48px;color:#b75f82}.text{font-size:19px;line-height:1.75;color:#593d47;margin:12px 0}.choose{margin:22px 0 7px;font-size:22px;line-height:1.5;color:#9e5873;font-weight:bold}.coincide{margin:22px 0 4px;font-size:16px;font-style:italic;color:#b16f88}.flower-btn{margin-top:22px;border:0;background:transparent;font-family:inherit;color:#a65b77;cursor:pointer}.flower{display:block;font-size:68px;animation:float 2.2s ease-in-out infinite}.click{display:block;margin-top:4px;font-size:12px;font-style:italic}.ending{margin-top:12px;height:30px;font-size:18px;font-style:italic;color:#a65b77;opacity:0;transform:translateY(8px);transition:1s}.ending.show{opacity:1;transform:none}.heart{position:fixed;z-index:1;bottom:-45px;pointer-events:none;animation:rise var(--duration) ease-in forwards;font-size:var(--size);opacity:0}@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}@keyframes rise{0%{opacity:0;transform:translateY(0) rotate(0) scale(.7)}15%{opacity:.8}75%{opacity:.7}100%{opacity:0;transform:translateY(-115vh) rotate(25deg) scale(1.15)}}@media(max-width:600px){.card{padding:42px 22px 35px}.title{font-size:40px}.text{font-size:17px}.choose{font-size:20px}}</style></head><body><main class="page"><section class="card"><div class="tiny">para vos ♡</div><h1 class="title">Te amo ♡</h1><p class="text">Espero que nunca olvides lo mucho que te amo.</p><p class="text">Incluso cuando estoy insoportable, cuando discutimos o cuando estamos a kilómetros de distancia.</p><p class="choose">Te elegiría a vos una y otra vez.</p><p class="coincide">gracias por coincidir conmigo ♡</p><button class="flower-btn" id="flowerBtn" type="button"><span class="flower">🌸</span><span class="click">click click click</span></button><div class="ending" id="ending">fin... por ahora ♡</div></section></main><script>const btn=document.getElementById('flowerBtn'),ending=document.getElementById('ending');let done=false;btn.onclick=()=>{if(done)return;done=true;ending.classList.add('show');btn.querySelector('.click').style.opacity='0';const symbols=['♡','♥','♡','💗'];for(let i=0;i<34;i++){setTimeout(()=>{const h=document.createElement('span');h.className='heart';h.textContent=symbols[Math.floor(Math.random()*symbols.length)];h.style.left=(Math.random()*100)+'vw';h.style.setProperty('--size',(16+Math.random()*20)+'px');h.style.setProperty('--duration',(4.5+Math.random()*3)+'s');document.body.appendChild(h);setTimeout(()=>h.remove(),8000)},i*90)}};</script></body></html>
