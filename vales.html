<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Incoming Octubre ♡</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;font-family:Georgia,"Times New Roman",serif;background:#f8c8dc;color:#a65b77}.page{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at 20% 20%,#ffffffa8,transparent 26%),radial-gradient(circle at 80% 80%,#ffffff70,transparent 30%)}.card{position:relative;width:min(94vw,900px);min-height:600px;padding:55px 35px 38px;background:#fffaf3;border-radius:30px;box-shadow:0 25px 70px #64283c38;text-align:center;overflow:hidden}.incoming{font-size:18px;letter-spacing:7px;margin:0;color:#9b6177;opacity:0;animation:fade .7s .4s forwards}.oct{font-size:55px;margin:9px 0 0;letter-spacing:4px;opacity:0;transform:translateY(10px);animation:titleIn .7s 2.1s forwards}.lux{margin:4px 0 30px;font-style:italic;color:#8b6473;opacity:0;animation:fade .6s 2.7s forwards}.flight{position:relative;height:110px;margin:4px auto 30px;overflow:visible}.trail{position:absolute;left:7%;right:7%;top:55%;border-top:3px dashed #d89bb2;opacity:.55}.plane{position:absolute;left:-120px;top:18px;font-size:62px;filter:drop-shadow(0 8px 7px #7e435b30);animation:fly 2.2s .45s cubic-bezier(.2,.7,.25,1) forwards}.vouchers{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}.voucher{width:220px;min-height:145px;border:2px dashed #dea4ba;border-radius:18px;background:#fffdf8;color:#8c5369;padding:25px 18px;cursor:pointer;box-shadow:0 10px 25px #7e435b1d;opacity:0;transform:translateY(25px) rotate(-2deg);font-family:inherit;transition:.25s}.voucher:nth-child(1){animation:voucherIn .55s 3s forwards}.voucher:nth-child(2){animation:voucherIn .55s 3.25s forwards}.voucher:nth-child(3){animation:voucherIn .55s 3.5s forwards}.voucher:hover{transform:translateY(-6px) rotate(1deg)!important;box-shadow:0 16px 30px #7e435b2c}.voucher strong{display:block;font-size:14px;letter-spacing:2px;margin-bottom:17px}.voucher span{font-size:28px}.message{height:28px;margin:22px 0 0;color:#a65b77;font-style:italic;opacity:0;transition:.25s}.message.show{opacity:1}.next{position:absolute;right:22px;top:18px;border:0;background:transparent;color:#a65b77;font-family:inherit;cursor:pointer;opacity:0;animation:fade .6s 4s forwards}.flower{display:block;font-size:47px;animation:float 2.1s ease-in-out infinite}.click{font-size:11px;font-style:italic}@keyframes fly{0%{left:-120px;transform:translateY(20px) rotate(-8deg)}55%{transform:translateY(-12px) rotate(4deg)}100%{left:calc(100% - 70px);transform:translateY(0) rotate(0)}}@keyframes fade{to{opacity:1}}@keyframes titleIn{to{opacity:1;transform:translateY(0)}}@keyframes voucherIn{to{opacity:1;transform:translateY(0) rotate(0)}}@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}@media(max-width:700px){.card{min-height:650px;padding:48px 16px 30px}.oct{font-size:39px}.incoming{font-size:14px;letter-spacing:5px}.flight{height:90px}.plane{font-size:49px}.voucher{width:min(100%,300px);min-height:95px;padding:16px}.voucher strong{margin-bottom:8px}.vouchers{gap:11px}}
</style>
</head>
<body>
<div class="page"><div class="card">
<button class="next" type="button"><span class="flower">🌸</span><span class="click">click click click</span></button>
<p class="incoming">INCOMING...</p><h1 class="oct">OCTUBRE ♡</h1><p class="lux">Luxembourg</p>
<div class="flight"><div class="trail"></div><div class="plane">✈️</div></div>
<div class="vouchers">
<button class="voucher" type="button"><strong>VALE 01</strong><span>???</span></button>
<button class="voucher" type="button"><strong>VALE 02</strong><span>???</span></button>
<button class="voucher" type="button"><strong>VALE 03</strong><span>???</span></button>
</div><div class="message" id="msg">todavía no jiji ♡</div>
</div></div>
<script>document.querySelectorAll('.voucher').forEach(v=>v.onclick=()=>{const m=document.getElementById('msg');m.classList.remove('show');void m.offsetWidth;m.classList.add('show')});</script>
</body></html>
