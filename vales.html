<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¿Quién vuela? ♡</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;background:#f8c8dc;color:#a65b77}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at 20% 20%,#ffffffa8,transparent 26%),radial-gradient(circle at 80% 80%,#ffffff70,transparent 30%)}.card{position:relative;width:min(94vw,900px);min-height:650px;padding:48px 35px 38px;background:#fffaf3;border-radius:30px;box-shadow:0 25px 70px #64283c38;text-align:center;overflow:hidden}h1{font-size:38px;margin:0 0 8px}.question{font-size:21px;color:#805466;margin:0 0 18px}.flight{position:relative;height:125px;margin:0 auto 8px}.trail{position:absolute;left:4%;right:4%;top:60%;border-top:3px dashed #d89bb2;opacity:.5}.plane{position:absolute;left:-180px;top:5px;font-size:88px;filter:drop-shadow(0 10px 9px #7e435b35);animation:fly 4.8s .3s cubic-bezier(.22,.7,.28,1) forwards}.after-flight{opacity:0;transform:translateY(18px);pointer-events:none;transition:.65s ease}.after-flight.show{opacity:1;transform:none;pointer-events:auto}.choices{display:flex;justify-content:center;gap:18px;margin:4px 0 12px}.choice{min-width:105px;height:54px;padding:0 20px;border:1px solid #e5aec3;background:#fff7fa;color:#985d75;border-radius:18px;font-family:inherit;font-size:19px;font-weight:bold;cursor:pointer;transition:.22s;box-shadow:0 7px 18px #7e435b18}.choice:hover{transform:translateY(-3px) scale(1.04);background:#f9e0e9}.travel-answer{min-height:58px;margin-bottom:2px;color:#b45e81;opacity:0;transform:translateY(5px);transition:.35s;font-style:italic}.travel-answer.show{opacity:1;transform:none}.travel-answer .heartline{display:block;font-size:23px;line-height:1}.travel-answer .dateline{display:block;margin-top:6px;font-size:18px}.vouchers-title{margin:8px 0 14px;font-size:15px;letter-spacing:3px;color:#a66b82}.vouchers{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}.voucher{position:relative;width:235px;min-height:150px;border:2px dashed #dea4ba;border-radius:18px;background:#fffdf8;color:#8c5369;padding:22px 16px;cursor:pointer;box-shadow:0 10px 25px #7e435b1d;font-family:inherit;overflow:hidden;transition:.3s}.voucher:hover{transform:translateY(-5px);box-shadow:0 16px 30px #7e435b2c}.voucher strong{display:block;font-size:13px;letter-spacing:2px;margin-bottom:15px}.gift{font-size:17px;line-height:1.45;filter:blur(7px);opacity:.28;transition:.45s}.cover{position:absolute;left:14px;right:14px;top:67px;height:4px;background:#bd6e8d;transform:rotate(-5deg);box-shadow:0 10px 0 #dba3b9,-3px -10px 0 #dba3b9;transition:.5s}.voucher:after{content:"click para revelar ♡";position:absolute;left:0;right:0;bottom:13px;font-size:11px;font-style:italic;color:#b57a91;transition:.3s}.voucher.revealed{background:#fff8fb;border-style:solid}.voucher.revealed .gift{filter:none;opacity:1}.voucher.revealed .cover{opacity:0;transform:translateX(120%) rotate(-8deg)}.voucher.revealed:after{opacity:0}.next{position:absolute;right:20px;top:16px;border:0;background:transparent;color:#a65b77;font-family:inherit;cursor:pointer;opacity:0;pointer-events:none;transition:.5s}.next.show{opacity:1;pointer-events:auto}.flower{display:block;font-size:45px;animation:float 2.1s ease-in-out infinite}.click{font-size:10px;font-style:italic}@keyframes fly{0%{left:-180px;transform:translateY(25px) rotate(-9deg)}35%{transform:translateY(-10px) rotate(2deg)}70%{transform:translateY(7px) rotate(-1deg)}100%{left:calc(100% - 90px);transform:translateY(0)}}@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}@media(max-width:700px){.page{padding:12px}.card{padding:55px 14px 28px;min-height:760px}h1{font-size:29px}.question{font-size:18px}.flight{height:105px}.plane{font-size:67px}.voucher{width:min(100%,310px);min-height:120px}.gift{font-size:15px}.cover{top:60px}}
</style></head><body><div class="page"><div class="card"><button class="next" id="nextBtn" type="button"><span class="flower">🌸</span><span class="click">click click click</span></button><h1>Entonces... ¿quién vuela? ✈️</h1><p class="question">¿Quién va a ver a quién? ♡</p><div class="flight"><div class="trail"></div><div class="plane">✈️</div></div><div class="after-flight" id="afterFlight"><div class="choices"><button class="choice" id="layBtn" type="button">Lay</button><button class="choice" id="robsBtn" type="button">Robs</button></div><div class="travel-answer" id="travelAnswer"><span class="heartline">♡</span><span class="dateline" id="answerText"></span></div><div class="vouchers-title">TRES VALES PARA TI</div><div class="vouchers"><button class="voucher" type="button"><strong>VALE 01 ♡</strong><div class="gift">El beso más lindo e intenso que tendrás</div><span class="cover"></span></button><button class="voucher" type="button"><strong>VALE 02 ♡</strong><div class="gift">Mimos y rasqui un día entero, solo pa ti</div><span class="cover"></span></button><button class="voucher" type="button"><strong>VALE 03 ♡</strong><div class="gift">Una cita donde vos sos el rey</div><span class="cover"></span></button></div></div></div></div><script>const afterFlight=document.getElementById('afterFlight'),ans=document.getElementById('travelAnswer'),answerText=document.getElementById('answerText'),nextBtn=document.getElementById('nextBtn');setTimeout(()=>{afterFlight.classList.add('show');nextBtn.classList.add('show')},5350);function showAnswer(text){answerText.textContent=text;ans.classList.remove('show');void ans.offsetWidth;ans.classList.add('show')}document.getElementById('layBtn').onclick=()=>showAnswer('¿octubre/noviembre?');document.getElementById('robsBtn').onclick=()=>showAnswer('conocerás a Kira 🐶 ♡');document.querySelectorAll('.voucher').forEach(v=>v.onclick=()=>v.classList.toggle('revealed'));</script></body></html>
